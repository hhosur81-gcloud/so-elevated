[project]
name = "so-elevated"
version = "0.1.0"
description = "Enterprise HR & IT Agentic Solution built on Google Cloud ADK with Live FastMCP Integrations and OKF Policy Grounding"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "google-adk",
    "google-cloud-aiplatform>=1.70.0",
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
